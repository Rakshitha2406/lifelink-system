name: Keep Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from going to sleep
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Service
        run: |
          if [ -n "${{ secrets.RENDER_URL }}" ]; then
            curl -s "${{ secrets.RENDER_URL }}" > /dev/null || true
          fi
